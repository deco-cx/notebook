#:schema node_modules/@deco/workers-runtime/config-schema.json
name = "notebook"
main = "main.ts"
compatibility_date = "2025-06-17"
compatibility_flags = [ "nodejs_compat" ]
scope = "deco"

[assets]
directory = "./view-build"
binding = "ASSETS"

[deco]
workspace = "deco"
enable_workflows = true
local = false

[[deco.bindings]]
name = "INTEGRATION_MANAGEMENT"
type = "mcp"
integration_id = "i:integration-management"

[[migrations]]
tag = "v1"
new_classes = [ "Workflow" ]

[durable_objects]
[[durable_objects.bindings]]
name = "DECO_CHAT_WORKFLOW_DO"
class_name = "Workflow"

[[rules]]
type = "Text"
globs = [ "**/*.sql" ]
fallthrough = true